<section id="envio-toggle-and-package">
  <span>Activar envío</span>
  <wallapop-toggle>
    <input
      type="checkbox"
      id="envio-toggle"
      aria-label="Activar envío"
      checked
    />
  </wallapop-toggle>
  <input type="radio" name="pkg" aria-label="delivery" />
  <input type="radio" name="pkg" aria-label="bulky" checked />
</section>
<section id="envio-weight">
  <p>¿Cuánto pesa?</p>
  <input type="radio" name="w" aria-label="Delivery Option 0" />
  <input type="radio" name="w" aria-label="Delivery Option 1" />
  <input type="radio" name="w" aria-label="Delivery Option 2" />
  <input type="radio" name="w" aria-label="Delivery Option 3" />
  <input type="radio" name="w" aria-label="Delivery Option 4" />
  <input type="radio" name="w" aria-label="Delivery Option 5" />
</section>
