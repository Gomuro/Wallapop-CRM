<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Catálogo Pro (fixture)</title></head>
<body>
  <!-- Wallapop Pro catalog, Activos tab, 40 rows per page. The pager text changes at once
       on Next; the rows can follow later (slow page) or never (stuck page). -->
  <wallapop-tab aria-label="Activos" aria-selected="true"></wallapop-tab>
  <wallapop-tab aria-label="Vendidos" aria-selected="false"></wallapop-tab>
  <table><tbody id="rows"></tbody></table>
  <tsl-pagination-actions>
    <walla-icon class="PaginationActions__action" id="prev"></walla-icon>
    <span class="PaginationActions__info"></span>
    <walla-icon class="PaginationActions__action" id="next"></walla-icon>
  </tsl-pagination-actions>
  <script>
    window.__catalog = {
      total: 100,
      pageSize: 40,
      // Page index (0-based) -> ms until its rows replace the old ones; -1 = never.
      rowDelays: {},
      // Page index -> total the pager claims on that page (Wallapop sometimes shows fewer).
      pagerTotals: {},
      // Vendidos rows carry the sold badge.
      tab: "Activos",
      page: 0,
      configure(options) {
        Object.assign(this, { rowDelays: {}, pagerTotals: {} }, options)
        this.page = 0
        this.paintPager()
        this.paintRows()
      },
      lastPage() {
        return Math.ceil(this.total / this.pageSize) - 1
      },
      paintPager() {
        const from = this.page * this.pageSize + 1
        const to = from + this.pageSize - 1
        const shown = this.pagerTotals[this.page] ?? this.total
        document.querySelector(".PaginationActions__info").textContent = from + "-" + to + " de " + shown
        document.getElementById("next").classList.toggle(
          "PaginationActions__action--disabled",
          this.page >= this.lastPage(),
        )
      },
      paintRows() {
        const body = document.getElementById("rows")
        body.innerHTML = ""
        const from = this.page * this.pageSize
        for (let n = from; n < Math.min(from + this.pageSize, this.total); n += 1) {
          const row = document.createElement("tr")
          row.id = "CatalogItem_" + n
          row.innerHTML =
            '<td><a href="https://es.wallapop.com/item/producto-' + n + "-13" + String(n).padStart(8, "0") +
            '"><span class="Title">Producto ' + n + "</span></a></td><td>" + (10 + n) + ",95 €" +
            (this.tab === "Vendidos" ? '<wallapop-badge badgetype="sold"></wallapop-badge>' : "") + "</td>"
          body.appendChild(row)
        }
      },
      move(step) {
        this.page += step
        this.paintPager()
        const delay = this.rowDelays[this.page] ?? 0
        if (delay < 0) return
        if (delay === 0) this.paintRows()
        else setTimeout(() => this.paintRows(), delay)
      },
    }
    document.querySelectorAll("wallapop-tab").forEach((tab) =>
      tab.addEventListener("click", () => {
        document.querySelectorAll("wallapop-tab").forEach((other) => other.setAttribute("aria-selected", String(other === tab)))
        window.__catalog.tab = tab.getAttribute("aria-label")
        window.__catalog.page = 0
        window.__catalog.paintPager()
        window.__catalog.paintRows()
      }),
    )
    document.getElementById("next").addEventListener("click", () => window.__catalog.move(1))
    document.getElementById("prev").addEventListener("click", () => window.__catalog.move(-1))
    window.__catalog.configure({})
  </script>
</body>
</html>
